<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a1d38">
  <title>Page Not Found | Vtechiee</title>
  <link rel="icon" type="image/png" href="/images/fav.png">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f;background:#f4f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(54,214,179,.18),transparent 28%),radial-gradient(circle at 90% 85%,rgba(46,115,255,.17),transparent 32%),#f4f8ff}.card{width:min(760px,100%);padding:clamp(32px,6vw,72px);border:1px solid rgba(12,35,70,.12);border-radius:32px;background:rgba(255,255,255,.92);box-shadow:0 28px 80px rgba(12,35,70,.14);text-align:center}.logo{width:min(210px,60%);height:auto;margin-bottom:30px}.code{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:9px 18px;border-radius:999px;background:#e8f9f5;color:#087f6c;font-weight:900;letter-spacing:.12em}.card h1{margin:22px 0 14px;font-size:clamp(2rem,7vw,4rem);line-height:1.05}.card p{max-width:560px;margin:0 auto 28px;color:#60708a;font-size:1.05rem;line-height:1.75}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none}.primary{background:#0a1d38;color:#fff}.secondary{border:1px solid rgba(12,35,70,.16);background:#fff;color:#0a1d38}.button:focus-visible{outline:3px solid rgba(46,115,255,.35);outline-offset:3px}@media(max-width:520px){.card{padding:34px 22px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/brand-logo.png" alt="Vtechiee">
    <span class="code">404</span>
    <h1>This page could not be found.</h1>
    <p>The address may have changed or the page may no longer exist. Return to the Vtechiee homepage or contact us for help.</p>
    <div class="actions">
      <a class="button primary" href="/">Return Home</a>
      <a class="button secondary" href="mailto:support@vtechiee.com">Contact Support</a>
    </div>
  </main>
</body>
</html>
